name: baton
label: Baton
kind: standalone
version: "0.1.0"
author: 4n0nn43x
description: >
  Hand your session and repository to your remote Hermes agent (Hermes Cloud, a VPS or Docker), close
  the laptop, and land a tested branch the next morning without touching your working tree.
requires_hermes: ">=0.23.0"
homepage: https://github.com/4n0nn43x/hermes-baton
license: MIT
provides_tools:
  - baton_receive
  - baton_check
  - baton_return
provides_hooks:
  - pre_verify
# config_schema and final fields are completed during integration (SPEC sections 7 and 8).
